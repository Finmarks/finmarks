name: Site

# Builds the discovery site on every PR and push as a build check. The deploy
# job only runs on push to main and requires manual approval via the
# "production" GitHub environment before it touches Cloudflare Pages.
#
# Optional repository secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#
# Without them the deploy step is skipped with a notice, so forks and
# contributors still get the build check.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'dist/**'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'dist/**'
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      # The site imports dist/index.json directly, so a missing or stale index
      # would silently produce a site with no entities.
      - name: Verify dataset is present
        run: test -f dist/index.json || (echo "::error::dist/index.json missing — run pnpm generate" && exit 1)

      - name: Build
        working-directory: site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://finmarks.pages.dev' }}
        run: npm run build

      - name: Check page count
        working-directory: site
        run: |
          pages=$(find dist -name '*.html' | wc -l)
          echo "built $pages pages"
          if [ "$pages" -lt 20 ]; then
            echo "::error::only $pages pages built — the dataset may not have loaded"
            exit 1
          fi

      - name: Upload build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site/dist

      - name: Check for Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not configured — skipping deploy."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=finmarks
